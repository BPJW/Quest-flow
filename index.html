<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainSpark - ADHD Task Magic</title>
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Canvas Confetti Library for Rewards -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <header>
        <h1>⚡ BrainSpark ⚡</h1>
        <p>Clear your head, gamify your day!</p>
        <div class="xp-bar-container">
            <div class="xp-bar" id="xpBar"></div>
        </div>
        <div class="stats">LEVEL: <span id="levelDisplay">1</span> | XP: <span id="xpDisplay">0</span>/100</div>
    </header>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Got a thought? Dump it here real quick...">
        <button class="btn-add" onclick="addTask()">DUMP! 🧠</button>
    </div>

    <div class="board">
        <!-- BRAIN DUMP -->
        <div class="column col-dump" data-status="dump">
            <div class="column-header">
                <h2>☁️ Brain Dump Zone</h2>
                <select class="sort-select" onchange="sortColumn('dump', this.value)">
                    <option value="newest">Newest</option>
                    <option value="alpha">A-Z</option>
                </select>
            </div>
            <div class="task-list" id="dumpList" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <!-- DOING -->
        <div class="column col-todo" data-status="todo">
            <div class="column-header">
                <h2>🎯 Active Focus</h2>
                <select class="sort-select" onchange="sortColumn('todo', this.value)">
                    <option value="newest">Newest</option>
                    <option value="alpha">A-Z</option>
                </select>
            </div>
            <div class="task-list" id="todoList" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>

        <!-- DONE -->
        <div class="column col-done" data-status="done">
            <div class="column-header">
                <h2>🎉 Crushed It!</h2>
                <select class="sort-select" onchange="sortColumn('done', this.value)">
                    <option value="newest">Newest</option>
                    <option value="alpha">A-Z</option>
                </select>
            </div>
            <div class="task-list" id="doneList" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
    </div>

    <!-- JavaScript App Logic -->
    <script src="app.js"></script>
</body>
</html>
