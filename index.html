<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>BrainSpark - ADHD Task Magic</title>
   <!-- Canvas Confetti Library for Rewards -->
   <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
   <style>
       :root {
           --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           --panel-dump: #fff176;
           --panel-todo: #81c784;
           --panel-done: #64b5f6;
           --text-dark: #2d3748;
       }

       body {
           font-family: 'Segoe UI', system-ui, sans-serif;
           background: var(--bg-gradient);
           min-height: 100vh;
           margin: 0;
           padding: 20px;
           color: var(--text-dark);
       }

       header {
           text-align: center;
           margin-bottom: 30px;
           background: rgba(255, 255, 255, 0.95);
           padding: 20px;
           border-radius: 24px;
           box-shadow: 0 10px 30px rgba(0,0,0,0.15);
           position: relative;
       }

       h1 { margin: 0; font-size: 2.5rem; color: #4a5568; text-shadow: 1px 1px #fff; }
       
       .sound-toggle {
           position: absolute;
           top: 20px;
           right: 20px;
           background: #edf2f7;
           border: 2px solid #cbd5e0;
           border-radius: 20px;
           padding: 5px 12px;
           cursor: pointer;
           font-weight: bold;
       }

       .xp-bar-container {
           background: #e2e8f0;
           border-radius: 20px;
           height: 25px;
           width: 70%;
           margin: 15px auto 5px;
           overflow: hidden;
           border: 3px solid #4a5568;
       }

       .xp-bar {
           background: linear-gradient(90deg, #38bdf8 0%, #ec4899 100%);
           height: 100%;
           width: 0%;
           transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
       }

       .stats { font-weight: bold; font-size: 1.2rem; margin-top: 8px; }

       .input-area {
           max-width: 600px;
           margin: 0 auto 30px;
           display: flex;
           gap: 12px;
       }

       input[type="text"] {
           flex: 1;
           padding: 16px;
           border: 3px solid #4a5568;
           border-radius: 16px;
           font-size: 1.1rem;
           outline: none;
           box-shadow: 3px 3px 0px #4a5568;
       }

       button.btn-add {
           background: #ff7675;
           color: white;
           border: 3px solid #4a5568;
           border-radius: 16px;
           padding: 0 28px;
           font-size: 1.1rem;
           font-weight: bold;
           cursor: pointer;
           box-shadow: 3px 3px 0px #4a5568;
           transition: transform 0.1s, box-shadow 0.1s;
       }
       button.btn-add:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #4a5568; }

       .board {
           display: grid;
           grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
           gap: 25px;
           max-width: 1200px;
           margin: 0 auto;
       }

       .column {
           background: rgba(255, 255, 255, 0.95);
           border: 4px solid #4a5568;
           border-radius: 24px;
           padding: 20px;
           box-shadow: 6px 6px 0px #4a5568;
           min-height: 450px;
           display: flex;
           flex-direction: column;
       }

       .column-header {
           display: flex;
           justify-content: space-between;
           align-items: center;
           margin-bottom: 20px;
           border-bottom: 3px dashed #4a5568;
           padding-bottom: 12px;
       }

       .column h2 { margin: 0; font-size: 1.4rem; }
       
       .col-dump { background-color: #fffde7; }
       .col-todo { background-color: #e8f5e9; }
       .col-done { background-color: #e3f2fd; }

       .task-list {
           flex: 1;
           display: flex;
           flex-direction: column;
           gap: 14px;
           padding-bottom: 20px;
       }

       .task {
           background: #fff;
           border: 3px solid #4a5568;
           border-radius: 16px;
           padding: 16px;
           cursor: grab;
           display: flex;
           justify-content: space-between;
           align-items: center;
           box-shadow: 4px 4px 0px #4a5568;
           transition: transform 0.2s, box-shadow 0.2s;
           animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
       }

       .task:active { cursor: grabbing; transform: translate(2px, 2px); box-shadow: 2px 2px 0px #4a5568; }
       .task.dragging { opacity: 0.4; }

       .task-buttons button {
           background: #edf2f7;
           border: 2px solid #4a5568;
           border-radius: 8px;
           font-size: 1.1rem;
           cursor: pointer;
           padding: 4px 8px;
           margin-left: 5px;
           transition: background 0.1s;
       }
       .task-buttons button:hover { background: #cbd5e0; }

       .sort-select {
           padding: 6px 12px;
           border-radius: 12px;
           border: 2px solid #4a5568;
           font-weight: bold;
           background: white;
           cursor: pointer;
       }

       @keyframes popIn {
           0% { transform: scale(0.6); opacity: 0; }
           100% { transform: scale(1); opacity: 1; }
       }
   </style>
</head>
<body>

   <header>
       <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊 SFX: ON</button>
       <h1>⚡ BrainSpark ⚡</h1>
       <p>Clear your head, gamify your day!</p>
       <div class="xp-bar-container">
           <div class="xp-bar" id="xpBar"></div>
       </div>
       <div class="stats">LEVEL: <span id="levelDisplay">1</span> | XP: <span id="xpDisplay">0</span>/100</div>
   </header>

   <div class="input-area">
       <input type="text" id="taskInput" placeholder="Got a thought? Dump it here real quick...">
       <button class="btn-add" onclick="addTask()">DUMP! 🧠</button>
   </div>

   <div class="board">
       <!-- BRAIN DUMP -->
       <div class="column col-dump" data-status="dump">
           <div class="column-header">
               <h2>☁️ Brain Dump Zone</h2>
               <select class="sort-select" onchange="sortColumn('dump', this.value)">
                   <option value="newest">Newest</option>
                   <option value="alpha">A-Z</option>
               </select>
           </div>
           <div class="task-list" id="dumpList" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
       </div>

       <!-- DOING -->
       <div class="column col-todo" data-status="todo">
           <div class="column-header">
               <h2>🎯 Active Focus</h2>
               <select class="sort-select" onchange="sortColumn('todo', this.value)">
                   <option value="newest">Newest</option>
                   <option value="alpha">A-Z</option>
               </select>
           </div>
           <div class="task-list" id="todoList" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
       </div>

       <!-- DONE -->
       <div class="column col-done" data-status="done">
           <div class="column-header">
               <h2>🎉 Crushed It!</h2>
               <select class="sort-select" onchange="sortColumn('done', this.value)">
                   <option value="newest">Newest</option>
                   <option value="alpha">A-Z</option>
               </select>
           </div>
           <div class="task-list" id="doneList" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
       </div>
   </div>

   <script>
       // Load data from LocalStorage or initialize defaults
       let xp = parseInt(localStorage.getItem('bs_xp')) || 0;
       let level = parseInt(localStorage.getItem('bs_level')) || 1;
       let tasks = JSON.parse(localStorage.getItem('bs_tasks')) || [];
       let soundEnabled = localStorage.getItem('bs_sound') !== 'false';

       // Update UI states immediately on load
       window.onload = function() {
           updateXPBar();
           updateSoundButtonDisplay();
           renderTasks();
       };

       function saveData() {
           localStorage.setItem('bs_xp', xp);
           localStorage.setItem('bs_level', level);
           localStorage.setItem('bs_tasks', JSON.stringify(tasks));
           localStorage.setItem('bs_sound', soundEnabled);
       }

       function toggleSound() {
           soundEnabled = !soundEnabled;
           updateSoundButtonDisplay();
           saveData();
       }

       function updateSoundButtonDisplay() {
           const btn = document.getElementById('soundToggle');
           btn.innerText = soundEnabled ? "🔊 SFX: ON" : "🔇 SFX: OFF";
       }

       // Web Audio Engine
       function playSound(type) {
           if (!soundEnabled) return;
           const ctx = new (window.AudioContext || window.webkitAudioContext)();
           const osc = ctx.createOscillator();
           const gain = ctx.createGain();
           osc.connect(gain);
           gain.connect(ctx.destination);

           if (type === 'complete') {
               osc.type = 'triangle';
               osc.frequency.setValueAtTime(150, ctx.currentTime);
               osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.3);
               gain.gain.setValueAtTime(0.3, ctx.currentTime);
               gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
               osc.start(); osc.stop(ctx.currentTime + 0.3);
           } else if (type === 'levelup') {
               osc.type = 'sawtooth';
               osc.frequency.setValueAtTime(300, ctx.currentTime);
               osc.frequency.setValueAtTime(450, ctx.currentTime + 0.1);
               osc.frequency.setValueAtTime(600, ctx.currentTime + 0.2);
               osc.frequency.setValueAtTime(900, ctx.currentTime + 0.3);
               gain.gain.setValueAtTime(0.2, ctx.currentTime);
               gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
               osc.start(); osc.stop(ctx.currentTime + 0.5);
           }
       }

       function addTask() {
           const input = document.getElementById('taskInput');
           if (!input.value.trim()) return;

           const newTask = {
               id: Date.now().toString(),
               text: input.value,
               status: 'dump',
               timestamp: Date.now()
           };

           tasks.push(newTask);
           input.value = '';
           renderTasks();
           saveData();
       }

       function renderTasks() {
           const lists = {
               dump: document.getElementById('dumpList'),
               todo: document.getElementById('todoList'),
               done: document.getElementById('doneList')
           };

           Object.values(lists).forEach(list => list.innerHTML = '');

           tasks.forEach(task => {
               const taskEl = document.createElement('div');
               taskEl.classList.add('task');
               taskEl.setAttribute('draggable', 'true');
               taskEl.setAttribute('id', task.id);
               taskEl.addEventListener('dragstart', dragStart);
               taskEl.addEventListener('dragend', dragEnd);

               taskEl.innerHTML = `
                   <span>${task.text}</span>
                   <div class="task-buttons">
                       ${task.status !== 'done' ? `<button onclick="changeStatus('${task.id}', 'done')">✅</button>` : ''}
                       <button onclick="deleteTask('${task.id}')">❌</button>
                   </div>
               `;

               lists[task.status].appendChild(taskEl);
           });
       }

       // Drag and Drop Handles
       function dragStart(e) {
           e.dataTransfer.setData('text/plain', e.target.id);
           setTimeout(() => e.target.classList.add('dragging'), 0);
       }

       function dragEnd(e) {
           e.target.classList.remove('dragging');
       }

       function allowDrop(e) {
           e.preventDefault();
       }

       function drop(e) {
           e.preventDefault();
           const id = e.dataTransfer.getData('text/plain');
           const targetColumn = e.target.closest('.column');
           if (targetColumn) {
               const newStatus = targetColumn.getAttribute('data-status');
               changeStatus(id, newStatus);
           }
       }

       function changeStatus(id, newStatus) {
           const task = tasks.find(t => t.id === id);
           if (task) {
               const oldStatus = task.status;
               task.status = newStatus;
               
               if (newStatus === 'done' && oldStatus !== 'done') {
                   gainXP(25);
                   playSound('complete');
                   confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
               }
               
               renderTasks();
               saveData();
           }
       }

       function deleteTask(id) {
           tasks = tasks.filter(t => t.id !== id);
           renderTasks();
           saveData();
       }

       function gainXP(amount) {
           xp += amount;
           if (xp >= 100) {
               xp -= 100;
               level++;
               playSound('levelup');
               confetti({ particleCount: 200, spread: 100, colors: ['#ff0000', '#00ff00', '#0000ff'] });
           }
           updateXPBar();
           saveData();
       }

       function updateXPBar() {
           document.getElementById('xpBar').style.width = `${xp}%`;
           document.getElementById('xpDisplay').innerText = xp;
           document.getElementById('levelDisplay').innerText = level;
       }

       function sortColumn(status, criteria) {
           const columnTasks = tasks.filter(t => t.status === status);
           
           if (criteria === 'alpha') {
               columnTasks.sort((a, b) => a.text.localeCompare(b.text));
           } else if (criteria === 'newest') {
               columnTasks.sort((a, b) => b.timestamp - a.timestamp);
           }

           tasks = tasks.filter(t => t.status !== status).concat(columnTasks);
           renderTasks();
           saveData();
       }

       document.getElementById('taskInput').addEventListener('keypress', (e) => {
           if (e.key === 'Enter') addTask();
       });
   </script>
</body>
</html>
