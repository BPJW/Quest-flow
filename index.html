<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestFlow Pro - ADHD Hub</title>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #162238;
            --accent: #10b981;
            --xp-color: #3b82f6;
            --dump-color: #a855f7;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text); margin: 0; padding: 15px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 440px; }
        .dashboard {
            background: var(--card-bg); padding: 15px; border-radius: 12px;
            margin-bottom: 15px; border-bottom: 4px solid var(--xp-color);
        }
        .stat-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
        .xp-bar-container { background: #1f293d; height: 10px; border-radius: 5px; overflow: hidden; }
        .xp-bar { background: var(--xp-color); height: 100%; width: 0%; transition: width 0.4s ease; }
        
        /* Brain Dump Box */
        .dump-zone {
            background: #111c30; border: 2px dashed var(--dump-color);
            padding: 15px; border-radius: 12px; margin-bottom: 20px;
        }
        textarea {
            width: 100%; height: 80px; background: #070d18; border: 1px solid #1f293d;
            border-radius: 8px; color: #fff; padding: 10px; box-sizing: border-box; font-family: inherit; resize: none;
        }
        
        /* Category Folders */
        .category-section { margin-top: 20px; }
        .category-header {
            font-size: 1rem; font-weight: bold; margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .task-card {
            background: var(--card-bg); padding: 12px; border-radius: 8px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            animation: slideIn 0.2s ease;
        }
        .tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: #fff; }
        .tag-urgent { background: #ef4444; }
        .tag-routine { background: #3b82f6; }
        .tag-low { background: #6b7280; }

        button {
            padding: 10px 14px; border-radius: 6px; border: none;
            background: var(--accent); color: #000; font-weight: bold; cursor: pointer;
        }
        .btn-purple { background: var(--dump-color); color: #fff; width: 100%; margin-top: 8px; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <!-- Player Stats -->
    <div class="dashboard">
        <div class="stat-row">
            <span>✨ Hero Level: <span id="levelDisplay">1</span></span>
            <span style="color: var(--accent);">⭐ XP: <span id="xpDisplay">0</span>/100</span>
        </div>
        <div class="xp-bar-container"><div class="xp-bar" id="xpBar"></div></div>
    </div>

    <!-- Brain Dump Space -->
    <div class="dump-zone">
        <h3 style="margin: 0 0 5px 0; color: var(--dump-color); font-size: 1.05rem;">🧠 Chaos Brain Dump</h3>
        <p style="margin: 0 0 10px 0; font-size: 0.8rem; color: var(--text-dim);">Type everything stressing you out in one big messy sentence. Let the app sort it.</p>
        <textarea id="brainDumpInput" placeholder="Example: clean my room today, call mom tomorrow, buy milk later, fix car ASAP..."></textarea>
        <button class="btn-purple" onclick="smashBrainDump()">Sort & Organize Automatically ✨</button>
    </div>

    <!-- Automated Lists -->
    <div class="category-section">
        <div class="category-header" style="color: #ef4444;">🚨 Urgent Quests (Do Now)</div>
        <div id="urgentList"></div>
    </div>

    <div class="category-section">
        <div class="category-header" style="color: #3b82f6;">📅 Routine & Tasks</div>
        <div id="routineList"></div>
    </div>

    <div class="category-section">
        <div class="category-header" style="color: #6b7280;">⏳ Backburner (Someday)</div>
        <div id="lowList"></div>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('questflow_v2')) || { tasks: [], xp: 0, level: 1 };

    function save() { localStorage.setItem('questflow_v2', JSON.stringify(state)); }

    // THE AUTOMATED SORTING ALGORITHM
    function smashBrainDump() {
        const text = document.getElementById('brainDumpInput').value;
        if (!text.trim()) return;

        // Split text by commas, periods, or the word "and" to isolate tasks
        const rawItems = text.split(/,|\.| and /);
        
        rawItems.forEach(item => {
            let taskText = item.trim();
            if (!taskText || taskText.length < 3) return;

            let priority = 'routine'; // Default lane

            // Automated Priority Keyword Matching
            const urgentKeywords = ['asap', 'urgent', 'today', 'now', 'important', 'fix'];
            const lowKeywords = ['later', 'someday', 'maybe', 'next week', 'whenever'];

            if (urgentKeywords.some(word => taskText.toLowerCase().includes(word))) {
                priority = 'urgent';
            } else if (lowKeywords.some(word => taskText.toLowerCase().includes(word))) {
                priority = 'low';
            }

            state.tasks.push({
                id: Date.now() + Math.random(),
                text: taskText,
                priority: priority
            });
        });

        document.getElementById('brainDumpInput').value = '';
        state.xp += 15; // Reward for clearing head
        if (state.xp >= 100) { state.level++; state.xp -= 100; }
        save();
        render();
    }

    function completeTask(id) {
        state.tasks = state.tasks.filter(t => t.id !== id);
        state.xp += 20;
        if (state.xp >= 100) { state.level++; state.xp -= 100; }
        save();
        render();
    }

    function render() {
        document.getElementById('levelDisplay').innerText = state.level;
        document.getElementById('xpDisplay').innerText = state.xp;
        document.getElementById('xpBar').style.width = `${state.xp}%`;

        // Clear all folders
        document.getElementById('urgentList').innerHTML = '';
        document.getElementById('routineList').innerHTML = '';
        document.getElementById('lowList').innerHTML = '';

        state.tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.innerHTML = `
                <div>
                    <span class="tag tag-${task.priority}">${task.priority.toUpperCase()}</span>
                    <span style="margin-left: 8px;">${task.text}</span>
                </div>
                <button onclick="completeTask(${task.id})">⚔️</button>
            `;

            // Automatically place task card in correct HTML folder container
            if (task.priority === 'urgent') document.getElementById('urgentList').appendChild(card);
            if (task.priority === 'routine') document.getElementById('routineList').appendChild(card);
            if (task.priority === 'low') document.getElementById('lowList').appendChild(card);
        });
    }

    render();
</script>
</body>
</html>
